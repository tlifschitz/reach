[project]
name = "reach"
version = "0.1.0"
description = "Optimize where things live, starting with your kitchen."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tobias Lifschitz" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
reach = "reach.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reach"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "reach/_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/reach/cli.py" = ["B008"]
"src/reach/api/*" = ["B008"]
